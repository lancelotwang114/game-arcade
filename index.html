<!DOCTYPE html>
<html lang="zh-TW" data-theme="felt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牌桌遊戲廳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Rye&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/core.css">
<link rel="stylesheet" href="games/liarsbar/liarsbar.css">
<link rel="stylesheet" href="games/texas/texas.css">
<link rel="stylesheet" href="games/bigtwo/bigtwo.css">
</head>
<body>

<div id="lobby">
  <div class="lobby-title">牌桌遊戲廳</div>
  <div class="lobby-sub">TABLE&nbsp;ARCADE</div>
  <div id="game-grid"></div>
</div>

<div id="stage"></div>
<div id="back-bar"></div>
<button id="back-btn" style="display:none">← 回大廳</button>

<!-- core -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script src="core/platform.js"></script>
<script src="core/theme.js"></script>
<script src="core/audio.js"></script>
<script src="core/ui.js"></script>
<script src="core/fx.js"></script>
<script src="core/cards.js"></script>
<script src="core/net.js"></script>

<!-- 各遊戲模組（尾端自行 Platform.register） -->
<script src="games/mahjong/mahjong.js"></script>
<script src="games/liarsbar/liarsbar.js"></script>
<script src="games/texas/texas.js"></script>
<script src="games/bigtwo/bigtwo.js"></script>

<script>
  // back-btn 由 platform.js 接管顯示/隱藏；初始隱藏
  document.getElementById('back-btn').onclick = () => Platform.exit();
</script>
</body>
</html>
