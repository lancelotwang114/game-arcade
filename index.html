<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牌桌遊戲廳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Rye&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/core.css">
<link rel="stylesheet" href="games/liarsbar/liarsbar.css">
<link rel="stylesheet" href="games/texas/texas.css">
<link rel="stylesheet" href="games/bigtwo/bigtwo.css">
<link rel="stylesheet" href="games/liarsdice/liarsdice.css">
<link rel="stylesheet" href="games/blackjack/blackjack.css">
</head>
<body>

<div id="lobby-bg" aria-hidden="true"></div>
<div id="lobby">
  <div class="lobby-title">牌桌遊戲廳</div>
  <div class="lobby-sub">TABLE&nbsp;ARCADE</div>
  <form id="join-form">
    <input id="join-code" maxlength="6" placeholder="朋友的房間碼" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="房間碼">
    <button class="btn">加入房間</button>
  </form>
  <div id="game-grid"></div>
</div>

<div id="stage"></div>
<button id="back-btn" style="display:none">← 回大廳</button>

<!-- core -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script src="core/platform.js"></script>
<script src="core/audio.js"></script>
<script src="core/ui.js"></script>
<script src="core/fx.js"></script>
<script src="core/cards.js"></script>
<script src="core/net.js"></script>
<script src="core/hud.js"></script>

<!-- 各遊戲模組（尾端自行 Platform.register） -->
<script src="games/mahjong/mahjong.js"></script>
<script src="games/liarsbar/liarsbar.js"></script>
<script src="games/texas/texas.js"></script>
<script src="games/bigtwo/bigtwo.js"></script>
<script src="games/liarsdice/liarsdice.js"></script>
<script src="games/blackjack/blackjack.js"></script>

<!-- 大廳 3D 背景：three.js 走 CDN，載入失敗就維持原本的素色大廳 -->
<script type="module">
const lobby = document.getElementById('lobby'), bg = document.getElementById('lobby-bg');
import('./core/lobby3d.js').then(m => { m.mount(bg, { active: () => lobby.style.display !== 'none' }); document.body.classList.add('bg3d'); })
  .catch(e => { console.warn('3D 大廳背景未載入', e); bg.remove(); });
</script>
</body>
</html>
